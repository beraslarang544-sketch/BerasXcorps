<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07080c" />
  <meta name="description" content="BerasXcorps HEX — studio first-party untuk APK milik sendiri: scan akurat, inject asset, virtual space host, dan PWA siap unduh." />
  <title>HEX Studio · BerasXcorps</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/icon-512.png" />
  <link rel="apple-touch-icon" href="/assets/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/hex.css" />
</head>
<body>
  <div id="boot">
    <div class="boot-card">
      <img src="/assets/logo-hex.png" alt="HEX" />
      <h1>HEX</h1>
      <p>BerasXcorps · first-party lab</p>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>

  <div id="app" class="no-inspect">
    <aside id="sidebar">
      <div class="brand">
        <img src="/assets/logo-hex.png" alt="" />
        <div>
          <b>HEX</b>
          <small>BerasXcorps</small>
        </div>
      </div>
      <div class="nav-label">Studio</div>
      <button class="nav-btn active" data-view="home"><span class="ico">◈</span><span>Beranda</span></button>
      <button class="nav-btn" data-view="lab"><span class="ico">▣</span><span>Farm Lab</span></button>
      <button class="nav-btn" data-view="scanner"><span class="ico">⌖</span><span>Memory Lab</span></button>
      <button class="nav-btn" data-view="apk"><span class="ico">⬡</span><span>APK Inject</span></button>
      <button class="nav-btn" data-view="vspace"><span class="ico">⧉</span><span>V-Space</span></button>
      <button class="nav-btn" data-view="bridge"><span class="ico">⌁</span><span>Bridge</span></button>
      <div class="nav-label">Paket</div>
      <button class="nav-btn" data-view="download"><span class="ico">↓</span><span>Unduh</span></button>
      <button class="nav-btn" data-view="policy"><span class="ico">⚑</span><span>Kebijakan</span></button>
      <div class="side-foot">
        <div class="policy">Hanya APK / proses milik Anda. HEX menolak attach proses orang lain, VirtualApp, dan exploit root.</div>
      </div>
    </aside>

    <header id="topbar">
      <div class="crumb">HEX / <b id="crumb">Beranda</b></div>
      <div class="grow"></div>
      <input class="search" id="cmd" placeholder="Perintah: scan, inject, unduh, farm…" />
      <span class="chip" id="own-chip">ownership: off</span>
      <span class="chip" id="ws-chip">bridge: idle</span>
      <button class="icon-btn" id="toggle-inspect" title="Inspector">☰</button>
    </header>

    <main id="main"></main>
    <aside id="inspector"></aside>
    <footer id="console">
      <div class="con-head">
        <span>Konsol</span>
        <span class="grow"></span>
        <button class="btn ghost" id="clr-log" style="padding:2px 8px;font-size:11px">bersihkan</button>
      </div>
      <div class="con-body" id="log"></div>
    </footer>
  </div>

  <nav id="dock" aria-label="Navigasi mobile">
    <button class="nav-btn active" data-view="home"><span class="ico">◈</span><span>Home</span></button>
    <button class="nav-btn" data-view="lab"><span class="ico">▣</span><span>Farm</span></button>
    <button class="nav-btn" data-view="scanner"><span class="ico">⌖</span><span>Scan</span></button>
    <button class="nav-btn" data-view="apk"><span class="ico">⬡</span><span>APK</span></button>
    <button class="nav-btn" data-view="download"><span class="ico">↓</span><span>Unduh</span></button>
  </nav>
  <div id="toasts"></div>
  <div id="modal"><div class="sheet" id="modal-sheet"></div></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
